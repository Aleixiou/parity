name: release

# Publishes to PyPI when a v* tag is pushed.
#
# Uses PyPI Trusted Publishing, so no API token exists in this repo or in
# GitHub secrets. Before the first release, create a pending publisher at
#   https://pypi.org/manage/account/publishing/
# for project `parity-diff`, owner `Aleixiou`, repo `parity-diff`, workflow
# `release.yml`, environment `pypi`.
#
# All five must match exactly. The repository was renamed from `parity`
# after v0.1.0, so a publisher created before that rename has to be edited
# or the next release is rejected.

on:
  push:
    tags: ["v*"]
  # Lets the build and its checks be rehearsed from a branch. It deliberately
  # cannot publish - see the `if` on the publish job.
  workflow_dispatch:

jobs:
  # Seconds, and first: a mistyped tag should not cost a full test matrix.
  guard:
    name: tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: compare the tag against pyproject
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag: $tag"
            if [ "$version" != "$tag" ]; then
              echo "::error::tag $tag does not match pyproject version $version"
              exit 1
            fi
          fi

  # Never publish something the suite has not passed.
  test:
    needs: guard
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: the built wheel must actually work
        # twine check validates metadata, not that the artifact runs. Installing
        # it into a clean environment with only the DuckDB extra also re-proves
        # that a single-engine user is never handed a PostgreSQL driver.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$(ls dist/*.whl)[duckdb]"
          /tmp/smoke/bin/parity --version
          /tmp/smoke/bin/parity --help > /dev/null
          if /tmp/smoke/bin/pip show psycopg mysql-connector-python > /dev/null 2>&1; then
            echo "::error::the duckdb extra pulled in another engine's driver"; exit 1
          fi

      - name: the sdist must carry a suite that runs
        # It once shipped test_*.py without conftest.py, so the tests it carried
        # could not run at all. A downstream packager has to be able to verify
        # this tool, or the trust argument is only words.
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/*/
          python -m pip install --quiet -e ".[duckdb,test]" pytest
          python -m pytest -q

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a real tag publishes. A manual run rehearses everything above and
    # stops here, so nobody can hand-fire an untagged release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub release page, created from the tag once the package is on PyPI.
  # Publishing to PyPI does not create one - before this job every version's
  # page was made by hand, and a tag could ship to PyPI with no release page at
  # all. Runs only after `publish`, so a release page never appears for a
  # version that failed to upload. The body is this version's CHANGELOG section,
  # so the notes stay curated rather than an autogenerated commit list - and a
  # tag with no CHANGELOG entry fails the job instead of publishing empty notes.
  github-release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create or edit a release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: build notes from the changelog and publish the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pull the "## <version> - ..." section out of the changelog, stopping
          # at the next "## " heading. The trailing space in the match keeps
          # 0.2.1 from also matching a future 0.2.10.
          body=$(awk -v v="## $version " 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::no CHANGELOG.md section found for $version"; exit 1
          fi
          {
            printf '```bash\n'
            printf 'pip install parity-diff           # DuckDB + PostgreSQL\n'
            printf 'pip install "parity-diff[all]"    # every engine, incl. MySQL\n'
            printf '```\n\n'
            printf 'The command and module are both `parity`.\n\n'
            printf -- '---\n'
            printf '%s\n' "$body"
          } > notes.md
          # Idempotent: a re-run of the workflow edits the existing page rather
          # than failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "parity-diff $version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "parity-diff $version" --notes-file notes.md
          fi
