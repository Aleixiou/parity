name: release

# Publishes to PyPI when a v* tag is pushed.
#
# Uses PyPI Trusted Publishing, so there is no API token anywhere in this repo
# or in GitHub secrets. Before the first release, create a pending publisher at
#   https://pypi.org/manage/account/publishing/
# for project `parity-diff`, owner `Aleixiou`, repo `parity`, workflow
# `release.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Never publish something the test suite has not passed.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: the tag must match the version in pyproject
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$version" != "$tag" ]; then
            echo "tag $tag does not match pyproject version $version"; exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
